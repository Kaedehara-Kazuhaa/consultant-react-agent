<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ReAct Agent 调试台</title>
<style>body{font:15px system-ui;background:#f5f7fb;color:#17243a;max-width:1100px;margin:32px auto;padding:0 20px}textarea,input,button{font:inherit;padding:10px;border:1px solid #bdc8da;border-radius:8px}textarea{width:95%;height:80px}button{background:#204dba;color:white;cursor:pointer}section{background:white;padding:20px;border-radius:12px;margin:16px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px ui-monospace,monospace}details{border-left:3px solid #7197eb;padding:10px;margin:10px 0}small{color:#536581}</style>
<h1>ReAct Agent 调试台</h1><p id="health">加载服务信息…</p>
<small>显示决策摘要、Action、Observation、评估及耗时；不展示隐藏思维链。默认使用合成开发数据。</small>
<section><form id="form"><textarea id="message">查询素材 M0001 在 2026-03-24 的消耗与ROI</textarea><p><input id="token" type="password" placeholder="API Token（若配置）" autocomplete="off"> <button id="run">运行</button></p></form><small>可连续输入：查素材M0001消耗 → 2026-03-24 → 前天呢 → 明白了。当前浏览器线程恢复槽位，30分钟无交互后过期。</small></section>
<section><h2>对话记录</h2><div id="conversation"></div></section>
<section><h2>回答</h2><pre id="answer">等待运行</pre><button id="export" disabled>导出 Trace JSONL</button></section>
<section><h2>执行 Trace</h2><div id="trace"></div></section>
<script>
let events=[],timer;
let session;
try{session=localStorage.getItem("consultant-agent-thread");if(!session){session=crypto.randomUUID();localStorage.setItem("consultant-agent-thread",session)}}catch{session=crypto.randomUUID()}
function addMessage(role,text){const p=document.createElement("pre");p.textContent=role+"："+text;el("conversation").append(p)}
const el=id=>document.getElementById(id);
fetch('/health').then(r=>r.json()).then(x=>el('health').textContent=`模式：${x.provider} · Agent：${x.profile} · 单一演示身份`).catch(()=>el('health').textContent='服务连接失败');
function render(items){events=items;el('trace').replaceChildren();for(const e of items){const d=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('pre');s.textContent=`${e.seq}. ${e.type} · ${e.timestamp}`;p.textContent=JSON.stringify(e.payload,null,2);d.append(s,p);d.open=['decision','action','observation','run_finished'].includes(e.type);el('trace').append(d)}el('export').disabled=!items.length}
el('form').onsubmit=async e=>{e.preventDefault();el('run').disabled=true;render([]);el('answer').textContent='执行中…';const id=crypto.randomUUID(),headers={'Content-Type':'application/json'};if(el('token').value)headers.Authorization='Bearer '+el('token').value;async function poll(){try{const r=await fetch('/api/traces/'+id,{headers});if(r.ok)render((await r.json()).events)}catch{}}timer=setInterval(poll,300);addMessage('用户',el('message').value);try{const r=await fetch('/api/run',{method:'POST',headers,body:JSON.stringify({message:el('message').value,request_id:id,session_id:session})});const x=await r.json();el('answer').textContent=JSON.stringify(x,null,2);addMessage('助手',x.response||JSON.stringify(x));await poll()}catch(err){el('answer').textContent=String(err)}finally{clearInterval(timer);el('run').disabled=false}};
el('export').onclick=()=>{const url=URL.createObjectURL(new Blob([events.map(e=>JSON.stringify(e)).join('\n')+'\n'],{type:'application/x-ndjson'})),a=document.createElement('a');a.href=url;a.download='agent-trace.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
</script></html>
