name: Agent checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent_service/frontend/package-lock.json
      - run: npm ci
        working-directory: agent_service/frontend
      - run: npm run build
        working-directory: agent_service/frontend
      - run: python -m pip install -e './agent_service[test]'
      - run: python -m pytest -q
        working-directory: agent_service
      - run: python -m ad_agent.evals
        working-directory: agent_service
